<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolveIT | Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4f46e5; --bg-color: #f8fafc; }
        body { font-family: 'DM Sans', sans-serif; background-color: var(--bg-color); overflow-x: hidden; }
        h1, h2, h3, h4, .font-display { font-family: 'Outfit', sans-serif; }
        
        .bg-shape { position: fixed; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 20s infinite alternate; }
        .shape1 { width: 500px; height: 500px; background: #c7d2fe; top: -100px; left: -100px; }
        .shape2 { width: 400px; height: 400px; background: #e0e7ff; bottom: -100px; right: -50px; animation-delay: -5s; }
        .shape3 { width: 600px; height: 600px; background: #fbcfe8; top: 20%; left: 30%; animation-delay: -10s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }

        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
        
        /* Badges */
        .status-open { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; }
        .status-progress { background: #e0e7ff; color: #4f46e5; border: 1px solid #a5b4fc; }
        .status-resolved { background: #dcfce3; color: #10b981; border: 1px solid #86efac; }
        .priority-urgent { animation: pulseBorder 2s infinite; border: 2px solid #ef4444; }
        @keyframes pulseBorder { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Chat UI Elements */
        #chatWidget { position: fixed; bottom: 20px; right: 20px; z-index: 100; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .chat-bubble-me { background: #4f46e5; color: white; border-radius: 16px 16px 4px 16px; padding: 8px 12px; max-width: 80%; width: fit-content; margin-left: auto; }
        .chat-bubble-them { background: #f1f5f9; color: #334155; border-radius: 16px 16px 16px 4px; padding: 8px 12px; max-width: 80%; width: fit-content; }
        
        #toast { position: fixed; top: 20px; right: 20px; z-index: 9999; transform: translateX(100%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #toast.show { transform: translateX(0); opacity: 1; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-10">

    <div class="bg-shape shape1"></div><div class="bg-shape shape2"></div><div class="bg-shape shape3"></div>

    <nav class="sticky top-4 z-[60] mx-4 md:mx-auto max-w-7xl glass-card rounded-2xl px-6 py-4 flex justify-between items-center mt-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-xl flex items-center justify-center text-white shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </div>
            <span class="text-2xl font-display font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600">ResolveIT</span>
        </div>
        <div id="navActions" class="hidden flex items-center gap-5">
            <div class="text-right hidden sm:block">
                <p id="userName" class="text-sm font-bold leading-tight text-slate-700"></p>
                <p id="roleBadge" class="text-[10px] font-black uppercase tracking-widest text-indigo-500"></p>
            </div>
            <button onclick="logout()" class="text-xs font-bold text-slate-500 hover:text-red-500 bg-white/50 hover:bg-white px-4 py-2 rounded-xl transition-all shadow-sm border border-white">Logout</button>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 flex flex-col justify-center">
        
        <section id="loginView" class="w-full max-w-sm mx-auto">
            <div class="glass-card p-10 rounded-[2.5rem] text-center">
                <div class="w-20 h-20 bg-white rounded-3xl shadow-xl shadow-indigo-100 mx-auto flex items-center justify-center mb-6"><span class="text-4xl">🛠️</span></div>
                <h2 class="text-3xl font-display font-black mb-2">Campus Helpdesk</h2>
                <button onclick="loginWithGoogle()" class="w-full mt-6 flex items-center justify-center gap-3 bg-white border border-slate-200 py-4 rounded-2xl font-bold hover:shadow-lg transition-all">
                    Continue with Google
                </button>
            </div>
        </section>

        <section id="roleView" class="hidden w-full max-w-2xl mx-auto">
            <div class="glass-card p-10 rounded-[2.5rem] text-center">
                <h2 class="text-3xl font-display font-black mb-6 text-slate-800">Select Your Role</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div onclick="setRole('user')" class="bg-white border-2 border-slate-100 p-8 rounded-[2rem] hover:border-indigo-500 cursor-pointer group">
                        <h3 class="font-display font-bold text-xl mb-2 text-slate-800">General User</h3>
                        <p class="text-xs text-slate-400 font-medium">Submit a help ticket</p>
                    </div>
                    <div onclick="showPinInput()" class="bg-white border-2 border-slate-100 p-8 rounded-[2rem] hover:border-blue-500 cursor-pointer group">
                        <h3 class="font-display font-bold text-xl mb-2 text-slate-800">Support Admin</h3>
                        <div id="pinArea" class="hidden mt-4 pt-4 border-t border-slate-100">
                            <input type="password" id="adminPin" placeholder="PIN" class="w-full p-4 rounded-xl bg-slate-50 border border-slate-200 text-center font-black tracking-widest outline-none mb-3" onclick="event.stopPropagation()">
                            <button onclick="verifyAdmin(event)" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Unlock Dashboard</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="userView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 glass-card p-8 rounded-[2.5rem] h-fit">
                <h3 class="text-2xl font-display font-black tracking-tight mb-6">Create Ticket</h3>
                <div class="space-y-4">
                    <select id="ticketCategory" class="w-full p-4 rounded-xl bg-white border border-slate-200 font-bold outline-none"><option>💻 IT & Network</option><option>🔧 Plumbing</option><option>⚡ Electrical</option></select>
                    
                    <select id="ticketPriority" class="w-full p-4 rounded-xl bg-white border border-slate-200 font-bold outline-none text-slate-700">
                        <option value="Normal">🟢 Normal Priority</option>
                        <option value="High">🟠 High Priority</option>
                        <option value="Urgent">🔴 URGENT (Critical Issue)</option>
                    </select>

                    <input type="text" id="ticketTitle" placeholder="Issue Title" class="w-full p-4 rounded-xl bg-white border border-slate-200 font-medium outline-none">
                    <textarea id="ticketDesc" rows="3" placeholder="Details..." class="w-full p-4 rounded-xl bg-white border border-slate-200 font-medium outline-none resize-none"></textarea>
                    <button onclick="submitTicket()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 shadow-lg mt-4">Submit Ticket</button>
                </div>
            </div>

            <div class="lg:col-span-2 glass-card p-8 rounded-[2.5rem]">
                <h3 class="text-2xl font-display font-black tracking-tight mb-6">My Active Tickets</h3>
                <div id="userTicketsList" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2"></div>
            </div>
        </section>

        <section id="adminView" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 rounded-3xl flex items-center gap-4"><div class="w-14 h-14 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center text-2xl font-black" id="statOpen">0</div><div><p class="text-sm font-bold text-slate-500 uppercase">Open</p></div></div>
                <div class="glass-card p-6 rounded-3xl flex items-center gap-4"><div class="w-14 h-14 bg-indigo-100 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl font-black" id="statProgress">0</div><div><p class="text-sm font-bold text-slate-500 uppercase">In Progress</p></div></div>
                <div class="glass-card p-6 rounded-3xl flex items-center gap-4"><div class="w-14 h-14 bg-emerald-100 text-emerald-500 rounded-2xl flex items-center justify-center text-2xl font-black" id="statResolved">0</div><div><p class="text-sm font-bold text-slate-500 uppercase">Resolved</p></div></div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem]">
                <h3 class="text-2xl font-display font-black tracking-tight mb-6">Global Queue</h3>
                <div id="adminTicketsList" class="grid grid-cols-1 lg:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-2"></div>
            </div>
        </section>
    </main>

    <div id="chatWidget" class="hidden flex flex-col items-end">
        <div id="chatPanel" class="hidden bg-white w-80 md:w-96 rounded-3xl shadow-2xl border border-slate-200 mb-4 overflow-hidden flex flex-col h-[500px]">
            <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md z-10">
                <div>
                    <h4 class="font-bold">Live Support</h4>
                    <p id="chatSubtitle" class="text-[10px] text-indigo-200 uppercase">Select an Admin</p>
                </div>
                <button onclick="toggleChat()" class="text-indigo-200 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
            </div>
            
            <div id="chatListView" class="flex-1 overflow-y-auto p-2 bg-slate-50">
                </div>

            <div id="chatMessageView" class="hidden flex-1 flex flex-col bg-white overflow-hidden">
                <button onclick="backToChatList()" class="text-xs font-bold text-indigo-600 p-2 bg-indigo-50 border-b border-indigo-100 text-left flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Back to List</button>
                <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 flex flex-col"></div>
                <div class="p-3 bg-white border-t border-slate-100 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-slate-100 rounded-full px-4 outline-none text-sm">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-indigo-700 transition"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg></button>
                </div>
            </div>
        </div>
        
        <button onclick="toggleChat()" class="bg-indigo-600 text-white w-16 h-16 rounded-full shadow-[0_10px_20px_rgba(79,70,229,0.4)] hover:scale-105 transition-all flex items-center justify-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        </button>
    </div>

    <div id="toast" class="glass-card px-6 py-4 rounded-2xl flex items-center gap-3 shadow-2xl border-b-4 border-indigo-500">
        <p id="toastMsg" class="font-bold text-slate-800"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // Added arrayUnion for the chat messages array
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, addDoc, serverTimestamp, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 👉 PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_DOMAIN.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userData = null;
        let activeChatId = null;
        let chatUnsubscribe = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        window.loginWithGoogle = async () => { try { await signInWithPopup(auth, provider); } catch(e){ showToast(e.message); } };
        window.logout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('roleView').classList.add('hidden');
                    document.getElementById('navActions').classList.remove('hidden');
                    document.getElementById('userName').innerText = userData.name;
                    document.getElementById('roleBadge').innerText = userData.role;
                    document.getElementById('chatWidget').classList.remove('hidden'); // Show Chat Widget

                    if (userData.role === 'admin') {
                        document.getElementById('adminView').classList.remove('hidden');
                        initAdmin();
                        initChatList('user'); // Admin sees Users
                    } else {
                        document.getElementById('userView').classList.remove('hidden');
                        initUser(user.uid);
                        initChatList('admin'); // User sees Admins
                    }
                } else {
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('roleView').classList.remove('hidden');
                }
            }
        });

        window.setRole = async (role) => {
            await setDoc(doc(db, "users", auth.currentUser.uid), { name: auth.currentUser.displayName, email: auth.currentUser.email, role: "user", createdAt: serverTimestamp() });
            location.reload(); 
        };

        window.showPinInput = () => { document.getElementById('pinArea').classList.remove('hidden'); document.getElementById('adminPin').focus(); };
        window.verifyAdmin = async (e) => {
            e.stopPropagation(); 
            if (document.getElementById('adminPin').value === "998877") { 
                await setDoc(doc(db, "users", auth.currentUser.uid), { name: auth.currentUser.displayName, email: auth.currentUser.email, role: "admin", createdAt: serverTimestamp() });
                location.reload();
            } else { showToast("Invalid PIN!"); }
        };

        function getStatusBadge(status) {
            if(status === 'Open') return `<span class="status-open px-2 py-1 rounded text-[10px] font-black uppercase">Open</span>`;
            if(status === 'In Progress') return `<span class="status-progress px-2 py-1 rounded text-[10px] font-black uppercase">In Progress</span>`;
            if(status === 'Resolved') return `<span class="status-resolved px-2 py-1 rounded text-[10px] font-black uppercase">Resolved</span>`;
        }

        // --- TICKET SUBMISSION (WITH PRIORITY) ---
        window.submitTicket = async () => {
            const title = document.getElementById('ticketTitle').value;
            const desc = document.getElementById('ticketDesc').value;
            const cat = document.getElementById('ticketCategory').value;
            const prio = document.getElementById('ticketPriority').value;

            if (!title || !desc) return showToast("Fill all details");

            await addDoc(collection(db, "tickets"), {
                userId: auth.currentUser.uid,
                userName: userData.name,
                title: title,
                description: desc,
                category: cat,
                priority: prio, // NEW!
                status: "Open", 
                assignedTo: null, // NEW: For claiming
                createdAt: serverTimestamp()
            });

            showToast("Ticket Created!");
            document.getElementById('ticketTitle').value = ""; document.getElementById('ticketDesc').value = "";
        };

        function initUser(uid) {
            onSnapshot(collection(db, "tickets"), (snap) => {
                const myTickets = snap.docs.filter(d => d.data().userId === uid).sort((a,b) => b.data().createdAt - a.data().createdAt);
                
                document.getElementById('userTicketsList').innerHTML = myTickets.map(doc => {
                    const d = doc.data();
                    const isUrgent = d.priority === 'Urgent' ? 'priority-urgent' : '';
                    const assignedStr = d.assignedTo ? `<span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold mt-2 inline-block">👨‍🔧 Handled by: ${d.assignedTo}</span>` : '';
                    
                    return `
                    <div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm ${isUrgent}">
                        <div class="flex justify-between items-start mb-2"><span class="text-xs font-bold text-slate-400 uppercase">${d.category}</span> ${getStatusBadge(d.status)}</div>
                        <h4 class="font-display font-bold text-lg text-slate-800">${d.title}</h4>
                        <p class="text-[10px] font-bold ${d.priority==='Urgent'?'text-rose-500':'text-blue-500'} uppercase mb-2">Priority: ${d.priority}</p>
                        <p class="text-sm text-slate-500">${d.description}</p>
                        ${assignedStr}
                    </div>`;
                }).join('');
            });
        }

        // --- ADMIN TICKET CLAIMING & UPDATING ---
        window.claimTicket = async (ticketId) => {
            await updateDoc(doc(db, "tickets", ticketId), { assignedTo: userData.name, status: 'In Progress' });
            showToast("Ticket assigned to you!");
        };

        window.resolveTicket = async (ticketId) => {
            await updateDoc(doc(db, "tickets", ticketId), { status: 'Resolved' });
            showToast("Ticket resolved!");
        };

        function initAdmin() {
            onSnapshot(collection(db, "tickets"), (snap) => {
                let o=0, p=0, r=0;
                const all = snap.docs.sort((a,b) => {
                    // Urgent tickets jump to top
                    if(a.data().priority === 'Urgent' && b.data().priority !== 'Urgent') return -1;
                    if(b.data().priority === 'Urgent' && a.data().priority !== 'Urgent') return 1;
                    return (b.data().createdAt?.seconds || 0) - (a.data().createdAt?.seconds || 0);
                });

                document.getElementById('adminTicketsList').innerHTML = all.map(doc => {
                    const d = doc.data();
                    if(d.status === 'Open') o++; if(d.status === 'In Progress') p++; if(d.status === 'Resolved') r++;
                    
                    const isUrgent = d.priority === 'Urgent' ? 'priority-urgent bg-rose-50' : '';
                    
                    let actionBtn = '';
                    if (d.status === 'Open') actionBtn = `<button onclick="claimTicket('${doc.id}')" class="text-xs bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-indigo-700">Assign to Me</button>`;
                    else if (d.status === 'In Progress' && d.assignedTo === userData.name) actionBtn = `<button onclick="resolveTicket('${doc.id}')" class="text-xs bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg">Mark Resolved</button>`;
                    else if (d.status === 'In Progress') actionBtn = `<span class="text-xs font-bold text-slate-400">Locked by ${d.assignedTo}</span>`;

                    return `
                    <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm ${isUrgent}">
                        <div class="flex justify-between items-start mb-2">
                            <div><p class="text-sm font-bold">${d.userName}</p><p class="text-[10px] font-bold ${d.priority==='Urgent'?'text-rose-500':'text-indigo-500'} uppercase">${d.priority} PRIORITY</p></div>
                            ${getStatusBadge(d.status)}
                        </div>
                        <h4 class="font-display font-bold text-md text-slate-800">${d.title}</h4>
                        <div class="flex justify-between items-center mt-4 border-t border-slate-100 pt-3">${actionBtn}</div>
                    </div>`;
                }).join('');

                document.getElementById('statOpen').innerText = o; document.getElementById('statProgress').innerText = p; document.getElementById('statResolved').innerText = r;
            });
        }

        // --- LIVE CHAT ENGINE ---
        window.toggleChat = () => {
            const panel = document.getElementById('chatPanel');
            panel.classList.toggle('hidden');
        };

        window.backToChatList = () => {
            document.getElementById('chatMessageView').classList.add('hidden');
            document.getElementById('chatListView').classList.remove('hidden');
            document.getElementById('chatSubtitle').innerText = userData.role === 'admin' ? "Select User" : "Select an Admin";
            if(chatUnsubscribe) chatUnsubscribe(); // Stop listening to old chat
        };

        // Populate the list of people to chat with
        function initChatList(targetRole) {
            const q = query(collection(db, "users"), where("role", "==", targetRole));
            onSnapshot(q, (snap) => {
                document.getElementById('chatListView').innerHTML = snap.docs.map(doc => {
                    if (doc.id === auth.currentUser.uid) return ''; // Don't show yourself
                    return `
                    <div onclick="openChat('${doc.id}', '${doc.data().name}')" class="bg-white p-3 mb-2 rounded-xl border border-slate-100 flex items-center gap-3 cursor-pointer hover:bg-indigo-50 transition">
                        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">${doc.data().name.charAt(0)}</div>
                        <div><p class="font-bold text-sm text-slate-800">${doc.data().name}</p><p class="text-[10px] text-slate-400 uppercase">Click to chat</p></div>
                    </div>`;
                }).join('');
            });
        }

        window.openChat = async (targetUid, targetName) => {
            document.getElementById('chatListView').classList.add('hidden');
            document.getElementById('chatMessageView').classList.remove('hidden');
            document.getElementById('chatSubtitle').innerText = `Chatting with ${targetName}`;
            
            // Create a unique, alphabetical Chat ID so both users share the same document
            const uids = [auth.currentUser.uid, targetUid].sort();
            activeChatId = `${uids[0]}_${uids[1]}`;
            
            const chatRef = doc(db, "chats", activeChatId);
            const chatSnap = await getDoc(chatRef);
            if (!chatSnap.exists()) {
                await setDoc(chatRef, { messages: [] });
            }

            // Listen to messages array
            if(chatUnsubscribe) chatUnsubscribe();
            chatUnsubscribe = onSnapshot(chatRef, (docSnap) => {
                const msgs = docSnap.data()?.messages || [];
                const area = document.getElementById('messagesArea');
                area.innerHTML = msgs.map(m => {
                    const isMe = m.senderId === auth.currentUser.uid;
                    return `<div class="${isMe ? 'chat-bubble-me' : 'chat-bubble-them'} text-sm shadow-sm">${m.text}</div>`;
                }).join('');
                area.scrollTop = area.scrollHeight; // Auto scroll to bottom
            });
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text || !activeChatId) return;

            input.value = "";
            const chatRef = doc(db, "chats", activeChatId);
            
            // Push new message object to the array
            await updateDoc(chatRef, {
                messages: arrayUnion({
                    senderId: auth.currentUser.uid,
                    text: text,
                    timestamp: new Date().toISOString()
                })
            });
        };

        // Send message on Enter key
        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
